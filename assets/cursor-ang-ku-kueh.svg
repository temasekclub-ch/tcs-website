<svg xmlns="http://www.w3.org/2000/svg" width="40" height="56" viewBox="0 0 40 56">
  <defs>
    <!-- slightly rough edge, like the painted halo -->
    <filter id="rough" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.2"/>
    </filter>
    <clipPath id="cake"><ellipse cx="20" cy="28" rx="13.6" ry="20.6"/></clipPath>
  </defs>
  <!-- green leaf: long rounded rectangle behind the cake -->
  <rect x="3" y="2" width="34" height="52" rx="14" fill="#35561b" filter="url(#rough)"/>
  <rect x="3" y="2" width="34" height="52" rx="14" fill="none" stroke="#6f8f2a" stroke-width="1" opacity=".55" filter="url(#rough)"/>
  <!-- red cake -->
  <ellipse cx="20" cy="28" rx="15" ry="22" fill="#d6404b"/>
  <ellipse cx="20" cy="28" rx="15" ry="22" fill="none" stroke="#f4a3a3" stroke-width="1.3"/>
  <!-- carved lines: stepped hexagon rings and spokes radiating from the centre, as in the painting -->
  <g clip-path="url(#cake)" fill="none" stroke="#f9c9c6" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round" opacity=".92">
    <polygon points="20.00,16.10 29.24,21.70 29.24,34.30 20.00,39.90 10.76,34.30 10.76,21.70"/>
    <polygon points="20.00,12.70 31.88,19.90 31.88,36.10 20.00,43.30 8.12,36.10 8.12,19.90"/>
    <polygon points="20.00,9.30 34.52,18.10 34.52,37.90 20.00,46.70 5.48,37.90 5.48,18.10"/>
    <polygon points="20.00,5.90 37.16,16.30 37.16,39.70 20.00,50.10 2.84,39.70 2.84,16.30"/>
    <path d="M20.00 19.50L20.00 2.50M26.60 23.50L39.80 14.50M26.60 32.50L39.80 41.50M20.00 36.50L20.00 53.50M13.40 32.50L0.20 41.50M13.40 23.50L0.20 14.50"/>
  </g>
  <!-- centre hexagon with the longevity character -->
  <polygon points="20.00,19.50 26.60,23.50 26.60,32.50 20.00,36.50 13.40,32.50 13.40,23.50" fill="#a92834" stroke="#f9c9c6" stroke-width="1"/>
  <text x="20" y="31.6" text-anchor="middle" font-size="11" font-family="'PingFang SC','Hiragino Sans GB','Noto Serif CJK SC','Songti SC',serif" fill="#f4a8a6">寿</text>
</svg>
